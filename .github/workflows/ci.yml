name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path ./EntraDeviceAuth -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost,PSUseSingularNouns,PSAvoidUsingEmptyCatchBlock | Tee-Object -Variable Results
          if ($Results | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Invoke-Pester -Path ./Tests -CI
